[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyforge"
version = "0.1.0"
description = "Typed polymer DSL and compiler for property prediction and inverse design"
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "lark>=1.2",
  "rdkit>=2025.9,<2025.10",
]

[project.scripts]
polyforge = "polyforge.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["polyforge*"]

[tool.setuptools.package-data]
"polyforge.grammar" = ["polyforge.lark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
