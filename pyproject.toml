[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyforge"
version = "0.1.0"
description = "Typed polymer DSL and compiler for property prediction and inverse design"
readme = "readme.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
polyforge = "polyforge.cli.main:main"

[tool.setuptools]
packages = ["polyforge", "polyforge.cli"]

